<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="900" height="560" fill="#fafafa"/>
  <text x="450" y="32" text-anchor="middle" font-size="22" font-weight="bold">PawPal+ System Architecture</text>

  <rect x="40" y="80" width="160" height="60" rx="8" fill="#cfe2ff" stroke="#0d6efd"/>
  <text x="120" y="108" text-anchor="middle" font-weight="bold">User</text>
  <text x="120" y="128" text-anchor="middle" font-size="12">Streamlit / CLI</text>

  <rect x="260" y="80" width="200" height="60" rx="8" fill="#d1e7dd" stroke="#198754"/>
  <text x="360" y="108" text-anchor="middle" font-weight="bold">app.py / main.py</text>
  <text x="360" y="128" text-anchor="middle" font-size="12">UI + session state</text>

  <rect x="520" y="80" width="200" height="60" rx="8" fill="#fff3cd" stroke="#ffc107"/>
  <text x="620" y="108" text-anchor="middle" font-weight="bold">PawPalAgent</text>
  <text x="620" y="128" text-anchor="middle" font-size="12">plan → act → check</text>

  <rect x="40" y="220" width="200" height="100" rx="8" fill="#e2e3e5" stroke="#6c757d"/>
  <text x="140" y="245" text-anchor="middle" font-weight="bold">pawpal_system.py</text>
  <text x="140" y="265" text-anchor="middle" font-size="12">Owner · Pet · Task</text>
  <text x="140" y="282" text-anchor="middle" font-size="12">Scheduler</text>
  <text x="140" y="300" text-anchor="middle" font-size="11" fill="#555">sort, filter, conflicts</text>

  <rect x="280" y="220" width="200" height="100" rx="8" fill="#f8d7da" stroke="#dc3545"/>
  <text x="380" y="245" text-anchor="middle" font-weight="bold">retriever.py</text>
  <text x="380" y="265" text-anchor="middle" font-size="12">TF-IDF + cosine</text>
  <text x="380" y="282" text-anchor="middle" font-size="12">RAG retrieval</text>

  <rect x="520" y="220" width="200" height="100" rx="8" fill="#fff3cd" stroke="#ffc107"/>
  <text x="620" y="245" text-anchor="middle" font-weight="bold">Guardrails</text>
  <text x="620" y="265" text-anchor="middle" font-size="12">toxic-term filter</text>
  <text x="620" y="282" text-anchor="middle" font-size="12">confidence score</text>
  <text x="620" y="299" text-anchor="middle" font-size="12">pawpal.log</text>

  <rect x="280" y="370" width="200" height="60" rx="8" fill="#f5f5f5" stroke="#999"/>
  <text x="380" y="395" text-anchor="middle" font-weight="bold">data/knowledge.json</text>
  <text x="380" y="415" text-anchor="middle" font-size="12">10 pet-care entries</text>

  <rect x="40" y="460" width="200" height="60" rx="8" fill="#e7f5ff" stroke="#1971c2"/>
  <text x="140" y="485" text-anchor="middle" font-weight="bold">tests/test_pawpal.py</text>
  <text x="140" y="505" text-anchor="middle" font-size="12">12 pytest cases</text>

  <rect x="280" y="460" width="200" height="60" rx="8" fill="#e7f5ff" stroke="#1971c2"/>
  <text x="380" y="485" text-anchor="middle" font-weight="bold">evaluate.py</text>
  <text x="380" y="505" text-anchor="middle" font-size="12">7-case harness</text>

  <rect x="520" y="460" width="200" height="60" rx="8" fill="#f5f5f5" stroke="#999"/>
  <text x="620" y="485" text-anchor="middle" font-weight="bold">Human review</text>
  <text x="620" y="505" text-anchor="middle" font-size="12">README + reflection</text>

  <line x1="200" y1="110" x2="260" y2="110" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="460" y1="110" x2="520" y2="110" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="360" y1="140" x2="160" y2="220" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="620" y1="140" x2="380" y2="220" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="620" y1="140" x2="620" y2="220" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="620" y1="220" x2="220" y2="220" stroke="#333" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <line x1="380" y1="320" x2="380" y2="370" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="140" y1="320" x2="140" y2="460" stroke="#1971c2" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <line x1="380" y1="430" x2="380" y2="460" stroke="#1971c2" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="620" y1="320" x2="620" y2="460" stroke="#1971c2" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr)"/>
</svg>
